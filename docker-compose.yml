version: '3.9'
services:
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
  server:
    build: .
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/ai-hr-platform
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: change_this_secret
    ports:
      - '5000:5000'
    depends_on:
      - mongo
  client:
    build: .
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - '5173:5173'
    depends_on:
      - server
volumes:
  mongo-data:
